<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd9e8">
<title>Hello Kitty's Little Secret ♡</title>
<link rel="stylesheet" href="kitty.css">
</head>
<body>
<main class="kitty-page">
  <div class="background-art" aria-hidden="true"></div>
  <div class="pink-wash" aria-hidden="true"></div>

  <section class="intro" id="intro" aria-label="Getting things ready">
    <div class="intro-card">
      <div class="intro-bow" aria-hidden="true">🎀</div>
      <p class="intro-kicker">A tiny hello from Hello Kitty</p>
      <h1>Getting things ready…</h1>
      <p class="intro-copy">Something cute is waiting for you.</p>
      <button id="peekButton" class="peek-button" type="button">Click to take a sneak peek <span>♡</span></button>
      <p class="intro-footnote">Turn your sound on for the full experience</p>
    </div>
  </section>

  <section class="phone-stage" id="phoneStage" hidden aria-label="Conversation with Hello Kitty">
    <div class="phone-wrap" id="phoneWrap">
      <div class="chat-screen" id="chatScreen" aria-live="polite" aria-label="Chat messages">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="typing-row" id="typingRow" hidden>
          <span class="typing-name">Hello Kitty</span>
          <span class="typing-dots" aria-label="typing"><i></i><i></i><i></i></span>
        </div>
      </div>
      <img class="phone-frame" src="assets/kitty_phone.webp" alt="Glossy pink Hello Kitty phone frame">
    </div>
    <button class="skip-button" id="skipButton" type="button" hidden>Skip chat ↓</button>
    <div class="ending" id="ending" hidden>
      <p>Our little adventure is ready ♡</p>
      <a class="world-button" href="cafe.html">Enter the new World <span>♡</span></a>
    </div>
  </section>
  <audio id="textAudio" src="assets/text.mp3" preload="auto"></audio>
</main>
<script src="kitty.js"></script>
</body>
</html>
